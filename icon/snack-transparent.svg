  <path fill="url(#bg)" d="M 218,63 L 806,63 A 155,155 0 0 1 961,218 L 961,635 A 155,155 0 0 1 806,790 L 455,790 C 392,860 281,917 185,925 C 270,884 281,834 314,790 L 218,790 A 155,155 0 0 1 63,635 L 63,218 A 155,155 0 0 1 218,63 Z"/>

