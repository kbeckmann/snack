<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#2BE8B0"/><stop offset="0.5" stop-color="#10C98A"/><stop offset="1" stop-color="#0699C9"/>
    </linearGradient>
    <linearGradient id="bub" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0E5E5C"/><stop offset="1" stop-color="#08333C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/><stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#A7F3E9"/><stop offset="1" stop-color="#2DD4BF"/>
    </radialGradient>
    <radialGradient id="hot" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#99F6FF"/><stop offset="1" stop-color="#22D3EE"/>
    </radialGradient>
    <filter id="bubsh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#053B3A" flood-opacity="0.45"/></filter>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#5EEAD4" flood-opacity="0.85"/></filter>
    <filter id="lglow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#5EEAD4" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#sheen)"/>

  <!-- Bubble body. Equal margin (63) on left/right/top; the body bottom sits
       higher so the long-droplet tail (variant 4) reads at its earlier, more
       balanced proportion. All four corners intact. -->
  <path filter="url(#bubsh)" fill="url(#bub)" d="M 218,63 L 806,63 A 155,155 0 0 1 961,218 L 961,635 A 155,155 0 0 1 806,790 L 455,790 C 392,860 281,917 185,925 C 270,884 281,834 314,790 L 218,790 A 155,155 0 0 1 63,635 L 63,218 A 155,155 0 0 1 218,63 Z"/>

  <!-- Mesh: scaled up and vertically centred on the body's midpoint (y=426.5). -->
  <g transform="translate(512,426.5) scale(1.12) translate(-512,-465)">

  <g stroke="#7FE9DC" stroke-opacity="0.45" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#lglow)">
    <path d="M512,250 L330,315 M512,250 L694,315 M330,315 L250,475 M694,315 L774,475
             M250,475 L330,635 M774,475 L694,635 M330,635 L512,680 M694,635 L512,680
             M512,250 L432,475 M512,250 L592,475 M432,475 L592,475
             M432,475 L250,475 M592,475 L774,475 M432,475 L330,635 M592,475 L694,635
             M432,475 L512,680 M592,475 L512,680 M330,315 L432,475 M694,315 L592,475"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="432" cy="475" r="37" fill="url(#hot)"/>
    <circle cx="592" cy="475" r="37" fill="url(#hot)"/>
    <circle cx="512" cy="250" r="28" fill="url(#node)"/>
    <circle cx="512" cy="680" r="26" fill="url(#node)"/>
    <circle cx="330" cy="315" r="27" fill="url(#node)"/>
    <circle cx="694" cy="315" r="27" fill="url(#node)"/>
    <circle cx="250" cy="475" r="29" fill="url(#node)"/>
    <circle cx="774" cy="475" r="29" fill="url(#node)"/>
    <circle cx="330" cy="635" r="26" fill="url(#node)"/>
    <circle cx="694" cy="635" r="26" fill="url(#node)"/>
  </g>

  </g>
</svg>
