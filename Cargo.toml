[package]
name = "snack"
version = "0.1.9"
edition = "2024"
rust-version = "1.89"

[dependencies]
libxmpp = { version = "0.3.1", path = "vendor/libxmpp" }
# Defaults minus the thread-pool executor (Snack runs on tokio) and Linux
# theme detection (Snack uses a fixed theme).
iced = { version = "0.14.0", default-features = false, features = [
    "tokio", "advanced", "wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland",
] }
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
log = "0.4.33"
env_logger = "0.11.11"
open = "5.4.0"
keyring-core = "1.0.0"
directories = "6.0.0"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
notify-rust = "4.18.0"
caseless = "0.2.2"
unicode-normalization = "0.1.26"
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
rusqlite = { version = "0.42", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSImage", "NSResponder", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.2", features = ["NSBundle", "NSData", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
iced_tiny_skia = "0.14.0"

# Optimize heavy UI dependencies while keeping Snack itself debuggable.
[profile.dev.package."*"]
opt-level = 3
